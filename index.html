<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Intro component with sign up form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main class="signForUsers">

    <div class="reading-info">
      <h1>Learn to code by <br> watching others</h1>

      <p class="notes">
        See how experienced developers solve problems in real-time. <br>Watching scripted tutorials is great, but understanding how <br>developers think is invaluable.
      </p>
      
    </div>
    

    <form id="UserForm">

      <p class="top-note"><strong>Try it free 7 days </strong> then $20/mo. thereafter</p>

      
        <input type="text" class="firstName" placeholder="First Name"></input>

        <input type="text" class="lastName" placeholder="Last Name"></input>

      
        <input type="email" class="e-address" placeholder="Email Address"></input>

        
        <input type="password" class="passcode" placeholder="Password"></input>

      <div class="submission">
       <button type="submit" class="Claim">CLAIM YOUR FREE TRIAL </button>
      </div>
      <footer id="conditions">By clicking the button, you are agreeing to our <span class="terms"> Terms and Services</span></footer>

    </form>

    
    

    


  </main>

    </p>
  </footer> -->
</body>
<script src="script.js"></script>
</html>
